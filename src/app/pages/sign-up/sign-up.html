<div class="min-h-screen flex items-center justify-center">
  <div class="bg-bg-card rounded-xl border border-border p-8 w-full max-w-sm">

    <div class="flex items-center justify-center gap-2 mb-8">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span class="font-serif font-bold italic text-xl text-primary tracking-tight">FaceSnap</span>
    </div>

    <h2 class="text-lg font-semibold text-white mb-6 text-center">Create your account</h2>

    <form (ngSubmit)="onSubmit()" #signUpForm="ngForm" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="displayName" class="text-sm font-medium text-gray-400">Display Name</label>
        <input
          id="displayName"
          type="text"
          name="displayName"
          [(ngModel)]="displayName"
          required
          placeholder="John Doe"
          class="bg-bg-input border border-border rounded-lg px-3 py-2 text-sm text-white outline-none focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-gray-600"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium text-gray-400">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="you@example.com"
          class="bg-bg-input border border-border rounded-lg px-3 py-2 text-sm text-white outline-none focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-gray-600"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-gray-400">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="bg-bg-input border border-border rounded-lg px-3 py-2 text-sm text-white outline-none focus:ring-2 focus:ring-primary focus:border-transparent placeholder:text-gray-600"
        />
      </div>

      @if (error()) {
        <p class="text-sm text-primary text-center">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="signUpForm.invalid || isLoading()"
        class="mt-2 w-full py-2 bg-primary text-white text-sm font-semibold rounded-lg hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isLoading() ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-primary font-semibold hover:underline">Sign in</a>
    </p>

  </div>
</div>
