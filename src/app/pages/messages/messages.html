<div class="min-h-screen pt-14">
  <div class="max-w-4xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden flex" style="height: calc(100vh - 6rem)">

      <!-- Conversation list sidebar -->
      <div class="w-72 border-r border-gray-200 flex flex-col flex-shrink-0">
        <div class="p-4 border-b border-gray-100">
          <h2 class="font-bold text-gray-900 text-lg">Messages</h2>
        </div>
        <ul class="flex-1 overflow-y-auto divide-y divide-gray-50">
          @for (conv of conversations; track conv.id) {
            <li class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-gray-50 transition-colors"
                [class.bg-orange-50]="conv.active">
              <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#9CA3AF">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <p class="font-medium text-sm text-gray-900 truncate">{{ conv.name }}</p>
                  <span class="text-xs text-gray-400 ml-2 flex-shrink-0">{{ conv.time }}</span>
                </div>
                <p class="text-xs text-gray-500 truncate">{{ conv.lastMessage }}</p>
              </div>
              @if (conv.unread) {
                <span class="w-5 h-5 bg-primary rounded-full flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0">
                  {{ conv.unread }}
                </span>
              }
            </li>
          }
        </ul>
      </div>

      <!-- Chat area -->
      <div class="flex-1 flex flex-col min-w-0">

        <!-- Chat header -->
        <div class="px-5 py-3 border-b border-gray-200 flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#9CA3AF">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <div>
            <p class="font-semibold text-gray-900 text-sm">Ember Franklin</p>
            <p class="text-xs text-green-500 font-medium">Online</p>
          </div>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-3">
          @for (msg of messages; track msg.id) {
            <div class="flex" [class.justify-end]="msg.mine">
              <div class="max-w-xs px-4 py-2.5 rounded-2xl text-sm leading-relaxed"
                   [class.bg-primary]="msg.mine"
                   [class.text-white]="msg.mine"
                   [class.rounded-br-sm]="msg.mine"
                   [class.bg-gray-100]="!msg.mine"
                   [class.text-gray-800]="!msg.mine"
                   [class.rounded-bl-sm]="!msg.mine">
                {{ msg.text }}
              </div>
            </div>
          }
        </div>

        <!-- Message input -->
        <div class="px-5 py-4 border-t border-gray-200 flex items-center gap-3">
          <input type="text" placeholder="Write a message…"
                 class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-primary/20 transition" />
          <button class="w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center hover:bg-primary-dark transition-colors flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
