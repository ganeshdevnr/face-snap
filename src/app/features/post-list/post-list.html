@if (isLoading() && posts().length === 0) {
  <div class="space-y-4">
    @for (skeleton of [1, 2, 3]; track skeleton) {
      <div class="bg-white rounded-xl border border-gray-200 p-4 animate-pulse">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-gray-200"></div>
          <div class="space-y-1.5">
            <div class="h-3 w-28 bg-gray-200 rounded"></div>
            <div class="h-2.5 w-16 bg-gray-200 rounded"></div>
          </div>
        </div>
        <div class="space-y-2">
          <div class="h-3 bg-gray-200 rounded w-full"></div>
          <div class="h-3 bg-gray-200 rounded w-4/5"></div>
        </div>
      </div>
    }
  </div>
} @else if (error()) {
  <div class="bg-white rounded-xl border border-red-200 p-6 text-center">
    <p class="text-sm font-medium text-red-600 mb-1">Failed to load posts</p>
    <p class="text-xs text-gray-500">{{ error() }}</p>
  </div>
} @else {
  <div class="flex flex-col gap-8">
    @for (post of posts(); track post.postId) {
      <app-post-card [post]="post" />
    }
  </div>
}
