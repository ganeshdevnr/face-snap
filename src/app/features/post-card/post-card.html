<article class="bg-bg-card border border-border rounded-[24px] p-5
              transition-[border-color] duration-200 hover:border-border-hover">

  <!-- Author row -->
  <div class="flex items-center gap-[11px] mb-[14px]">

    <!-- Avatar: 38px, gradient by author name charcode -->
    <div [class]="'w-[38px] h-[38px] rounded-full flex-shrink-0 flex items-center justify-center overflow-hidden av-grad-' + (post().author.name.charCodeAt(0) % 8)">
      @if (post().author.avatarUrl) {
        <img [src]="post().author.avatarUrl" [alt]="post().author.name" class="w-full h-full object-cover" />
      } @else {
        <span class="text-white font-display font-bold text-[13px]">
          {{ post().author.name.slice(0, 2).toUpperCase() }}
        </span>
      }
    </div>

    <div class="flex-1">
      <p class="font-display font-bold text-[13px] text-text mb-[1px]">{{ post().author.name }}</p>
      <p class="text-[11px] text-text-3">{{ post().createdDate | timeAgo }}</p>
    </div>

    <!-- Vertical dots menu -->
    <button class="w-[26px] h-[26px] rounded-full flex items-center justify-center
                   text-text-3 hover:bg-bg-card-hover hover:text-text-2
                   transition-all duration-[150ms]">
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="5"  r="1.5"/>
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <p class="text-[13.5px] text-text-2 leading-[1.72] mb-4">{{ post().content }}</p>

  <!-- Divider -->
  <div class="h-px bg-border mb-3"></div>

  <!-- Actions -->
  <div class="flex gap-[2px]">
    <button class="flex items-center gap-[6px] px-[11px] py-[7px] rounded-[10px]
                   text-text-2 font-body text-[12px] font-medium
                   hover:bg-bg-card-hover hover:text-text
                   transition-all duration-[150ms]">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
      </svg>
      {{ post().likes }}
    </button>
    <button class="flex items-center gap-[6px] px-[11px] py-[7px] rounded-[10px]
                   text-text-2 font-body text-[12px] font-medium
                   hover:bg-bg-card-hover hover:text-text
                   transition-all duration-[150ms]">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      {{ post().comments }}
    </button>
    <button class="flex items-center gap-[6px] px-[11px] py-[7px] rounded-[10px]
                   text-text-2 font-body text-[12px] font-medium
                   hover:bg-bg-card-hover hover:text-text
                   transition-all duration-[150ms]">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      {{ post().shares }}
    </button>
  </div>

</article>
