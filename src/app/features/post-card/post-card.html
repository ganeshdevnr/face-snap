<article class="bg-white rounded-xl border border-gray-200 p-4">

  <!-- Author header -->
  <div class="flex items-start justify-between mb-3">
    <div class="flex items-center gap-3">
      <img [src]="post().author.avatarUrl" [alt]="post().author.name"
           class="w-10 h-10 rounded-full bg-gray-200 object-cover flex-shrink-0" />
      <div>
        <span class="font-semibold text-gray-900 text-sm">{{ post().author.name }}</span>
        <p class="text-xs text-gray-400 mt-0.5">{{ post().createdDate | timeAgo }}</p>
      </div>
    </div>
    <button class="p-1.5 rounded-full hover:bg-gray-100 text-gray-400 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
      </svg>
    </button>
  </div>

  <!-- Content -->
  <p class="text-gray-800 text-sm leading-relaxed mb-3">{{ post().content }}</p>

  <!-- Actions -->
  <div class="flex items-center gap-6 pt-3 border-t border-gray-100">
    <button class="flex items-center gap-1.5 text-gray-500 hover:text-primary text-sm transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
        <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
      </svg>
      <span>{{ post().likes }}</span>
    </button>
    <button class="flex items-center gap-1.5 text-gray-500 hover:text-primary text-sm transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>{{ post().comments }}</span>
    </button>
    <button class="flex items-center gap-1.5 text-gray-500 hover:text-primary text-sm transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span>{{ post().shares }}</span>
    </button>
  </div>

</article>
