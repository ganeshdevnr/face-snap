<div class="bg-white rounded-xl border border-gray-200 p-4">

  <h3 class="font-semibold text-gray-900 mb-4">Friend Suggestions</h3>

  <ul class="space-y-3">
    @for (person of suggestions(); track person.handle) {
      <li class="flex items-center gap-3">
        <img [src]="person.avatarUrl" [alt]="person.name" class="w-9 h-9 rounded-full object-cover flex-shrink-0" />
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm text-gray-900 truncate">{{ person.name }}</p>
          <p class="text-xs text-gray-500 truncate">@{{ person.handle }}</p>
        </div>
        @if (person.isRequested) {
          <button (click)="onCancelFriendRequest(person.userId)" class="flex-shrink-0 px-3 py-1.5 bg-gray-200 text-gray-600 text-xs font-semibold rounded-full hover:bg-gray-300 transition-colors">
            Cancel
          </button>
        } @else {
          <button (click)="onAddFriend(person.userId)" class="flex-shrink-0 px-3 py-1.5 bg-primary text-white text-xs font-semibold rounded-full hover:bg-primary-dark transition-colors">
            Add Friend
          </button>
        }
      </li>
    }
  </ul>

</div>
