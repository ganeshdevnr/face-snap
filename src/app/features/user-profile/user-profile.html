<div class="bg-bg-card border border-border rounded-[24px] transition-[border-color] duration-200 hover:border-border-hover
            px-5 py-7 flex flex-col items-center text-center">

  <!-- Avatar ring: 84px, 2.5px padding, 3-stop gradient -->
  <div class="avatar-ring w-[84px] h-[84px] rounded-full p-[2.5px] mb-4 flex-shrink-0">
    <div class="avatar-inner-bg w-full h-full rounded-full border-[3px] border-bg-page
                flex items-center justify-center overflow-hidden">
      @if (authUser()?.avatarUrl) {
        <img [src]="authUser()!.avatarUrl" [alt]="authUser()!.displayName" class="w-full h-full object-cover" />
      } @else {
        <span class="font-display font-extrabold text-[26px] text-text">
          {{ authUser()?.displayName?.charAt(0)?.toUpperCase() }}
        </span>
      }
    </div>
  </div>

  <!-- Name -->
  <p class="font-display font-extrabold text-[17px] text-text tracking-[-0.3px] mb-[3px]">
    {{ authUser()?.displayName }}
  </p>

  <!-- Role -->
  <p class="text-[10px] font-semibold text-primary uppercase tracking-[1px] mb-[14px]">
    {{ role }}
  </p>

  <!-- Bio -->
  <p class="text-[13px] text-text-2 leading-[1.65] mb-5 px-[2px]">
    {{ bio }}
  </p>

  <!-- Stats grid -->
  <div class="w-full grid grid-cols-3 border border-border rounded-[16px] overflow-hidden mb-[18px]">
    <div class="flex flex-col items-center gap-[2px] py-3 px-1 border-r border-border">
      <span class="font-display font-bold text-[16px] text-text">{{ posts }}</span>
      <span class="text-[10px] font-medium text-text-3 uppercase tracking-[0.4px]">Posts</span>
    </div>
    <div class="flex flex-col items-center gap-[2px] py-3 px-1 border-r border-border">
      <span class="font-display font-bold text-[16px] text-text">{{ followers }}</span>
      <span class="text-[10px] font-medium text-text-3 uppercase tracking-[0.4px]">Followers</span>
    </div>
    <div class="flex flex-col items-center gap-[2px] py-3 px-1">
      <span class="font-display font-bold text-[16px] text-text">{{ following }}</span>
      <span class="text-[10px] font-medium text-text-3 uppercase tracking-[0.4px]">Following</span>
    </div>
  </div>

  <!-- Edit Profile button -->
  <button class="w-full py-[9px] rounded-[16px] bg-bg-card border border-border
                 text-[13px] font-medium text-text-2
                 hover:bg-bg-card-hover hover:text-text hover:border-border-hover
                 transition-all duration-[180ms] cursor-pointer">
    Edit Profile
  </button>

</div>
